[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo2print3d"
version = "0.2.0"
description = "Local-first image-to-printable-3D pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "gradio>=5.49,<6.0",
  "networkx>=3.2,<4.0",
  "numpy>=1.26,<3.0",
  "Pillow>=10.1,<12.0",
  "rich>=13.7,<15.0",
  "scipy>=1.11,<2.0",
  "trimesh>=4.0.5,<6.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-github-actions-annotate-failures>=0.3,<1.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
photo2print3d = "photo2print3d.cli:app"

[tool.setuptools.packages.find]
include = ["photo2print3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["photo2print3d"]
